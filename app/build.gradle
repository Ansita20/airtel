plugins {
    id 'com.android.application'
}

// Help bot: optional AI layer. The Anthropic key is read from local.properties (git-ignored),
// never hard-coded:  ANTHROPIC_API_KEY=sk-ant-...   Without it the bot runs offline from its KB.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def anthropicKey = localProps.getProperty('ANTHROPIC_API_KEY', '')

android {
    namespace 'com.udyam.digital'
    // android-34 is not installed in your SDK; compiling against 35 is fine while targeting 34.
    compileSdk 35

    defaultConfig {
        applicationId "com.udyam.digital"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'ANTHROPIC_API_KEY', "\"${anthropicKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8: shrink + obfuscate. proguard-rules.pro also strips Log.d / Log.v / Log.i.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned demo build: sign with your own key for the Play Store.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.all {
            // Help-bot tests read the real assets (KB, catalogue, registry) from disk.
            systemProperty 'udyam.assets', file('src/main/assets').absolutePath
            // Pure-Java engines read the same string resources the app ships (I18n / XmlSource).
            systemProperty 'udyam.res', file('src/main/res').absolutePath
            testLogging {
                events "passed", "failed", "skipped"
                exceptionFormat "full"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'   // help bot chat
    implementation 'androidx.core:core-splashscreen:1.0.1'      // logo on start-up

    // Smart KYC
    // On-device OCR (bundled models: images never leave the phone).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    // Document scanner (Google Play services): edge detection, auto-capture, crop, perspective
    // fix, shadow/stain cleanup. Runs in Play services; no camera permission needed.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    // Fallback camera capture when Play services are missing.
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    // EncryptedFile / EncryptedSharedPreferences backed by the Android Keystore (one key per application).
    implementation 'androidx.security:security-crypto:1.1.0'
    // Fingerprint / face / device PIN before showing a stored document.
    implementation 'androidx.biometric:biometric:1.1.0'
    // Daily retention job.
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    // On-device tests for the real Keystore + EncryptedFile (./gradlew connectedDebugAndroidTest).
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
